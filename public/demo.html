enter;gap:10px}.btn{border:none;border-radius:11px;padding:11px 16px;background:#236e56;color:white;font-size:12px;font-weight:800}.btn.secondary{background:#e7f0ea;color:#2e735d}.btn.outline{border:1px solid #d5e4dc;background:white;color:#37745d}.btn.red{background:#fbebeb;color:#a94850}.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}.field label{font-size:11px;font-weight:780;color:#4b6065}.field input,.field select{background:white;color:#253945;border:1px solid #dbe5df;border-radius:10px;padding:12px;width:100%;font-size:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.whole{grid-column:1/-1}.dialogshade{position:fixed;inset:0;background:#0d1d2db0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.dialog{width:min(100%,510px);background:#fff;padding:24px;border-radius:19px;box-shadow:0 20px 100px #0004;max-height:92vh;overflow-y:auto}.dialog h3{margin:0 0 5px;font-size:20px}.dialog p{margin:0 0 20px;color:var(--muted);font-size:12px}.dialogfooter{display:flex;gap:10px;justify-content:flex-end;margin-top:19px}.topcontrols{margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.topcontrols h2{font-size:18px;margin:0}.optionrow{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.optionrow strong{font-size:13px}.optionrow small{display:block;font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}.optionrow input{width:125px;border:1px solid #dce6e1;border-radius:8px;padding:10px;text-align:right}.optionrow select{border:1px solid #dce6e1;border-radius:8px;padding:10px}.activity{display:flex;flex-direction:column;gap:0}.activityitem{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}.activityitem .dot{width:36px;height:36px;border-radius:50%;background:#ebf4ef;color:#3b8268;display:grid;place-items:center}.activityitem strong{font-size:12px}.activityitem p{font-size:11px;color:var(--muted);margin:5px 0}.activityitem small{color:#adb8b8;font-size:10px}.empty{color:var(--muted);font-size:12px;text-align:center;padding:50px 12px}.foot{margin:26px 0;text-align:center;font-size:11px;color:#9aa7a9}.mobilebar{display:none}.toast{position:fixed;z-index:200;right:24px;bottom:25px;padding:13px 17px;border-radius:12px;background:#142b2b;color:white;font-size:12px;box-shadow:0 10px 40px #0002;max-width:min(400px,85vw)}.hidden{display:none!important}#fileImport{display:none}.privacy-panel{background:#f0f6f2;border:1px solid #d8e8df;padding:17px;border-radius:12px;font-size:12px;line-height:1.65;color:#3f6c5b}.mobilemark{display:none}@media(max-width:1050px){.side{width:206px}.main{margin-left:206px;width:calc(100% - 206px);padding:34px 28px}.overview,.columns{grid-template-columns:1fr}.breakdown{min-height:240px}.metrics{gap:10px}}@media(max-width:720px){.side{display:none}.main{width:100%;margin:0;padding:24px 15px 105px}.mobilemark{display:block;font-weight:850;font-size:21px;letter-spacing:-1px;margin-bottom:21px}.mobilemark b{color:#378365}.top h1{font-size:27px}.topright .avatars{display:none}.overview{gap:12px}.hero{padding:25px 22px;min-height:234px}.hero h2{font-size:41px}.heroheader{align-items:flex-start}.months{gap:3px}.months span{min-width:77px;font-size:10px}.months button{height:26px;width:26px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(3){grid-column:1/-1}.panel{padding:19px}.breakdown{padding:21px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e9e4;height:76px;justify-content:space-around;align-items:center;z-index:50;padding-bottom:env(safe-area-inset-bottom)}.mobilebar button{background:none;border:0;display:flex;align-items:center;flex-direction:column;gap:6px;color:#899a99;font-size:10px;font-weight:700;min-width:55px}.mobilebar button.active{color:#27775c}.mobilebar svg{width:20px;height:20px}.topcontrols{flex-wrap:wrap}.fullbill{padding:14p </style></head><body><div class="shell">
<aside class="side"><div class="brand">homebase<b>.</b></div><p class="tagline">YOUR HOME, TAKEN CARE OF.</p><nav class="nav" id="sideNav"></nav><div class="side-bottom"><div class="shield">♙</div><div><b>Private by design</b><br>No banks connected in demo mode.</div></div></aside>
<main class="main"><div class="mobilemark">homebase<b>.</b></div><header class="top"><div><span class="eyebrow" id="headerEyebrow">The Urbano Household</span><h1 id="headerTitle">Good to be home.</h1><p class="sub" id="headerSub">Everything you need to stay ahead of household bills.</p></div><div class="topright"><span class="pill demo" title="This demo stores data only on this device">● Offline demo</span><div class="avatars" style="display:flex;padding-left:8px"><span class="avatar">J</span><span class="avatar">A</span></div></div></header><div id="view"></div><footer class="foot">HomeBase · Local demo only · No real bank connection, household sync or push alerts</footer></main>
</div><nav class="mobilebar" id="mobileNav"></nav><div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div><input type="file" id="fileImport" accept=".json,application/json">
<script>
(()=>{'use strict';
const KEY='homebase_demo_v2'; const tabs=[['home','⌂','Overview'],['bills','▤','Bills'],['activity','♧','Activity'],['settings','⚙','Settings']];
const initial=()=>({month:'2026-11',budget:3000,share:50,nextId:6,household:'Alex & Sam',bills:[{id:1,name:'Apartment rent',amount:1800,day:null,category:'Housing',payer:'Shared',confirmed:true,paid:{}},{id:2,name:'Xfinity internet',amount:60,day:null,category:'Internet',payer:'Shared',confirmed:false,paid:{}},{id:3,name:'Electricity',amount:null,day:null,category:'Utilities',payer:'Shared',confirmed:false,paid:{}},{id:4,name:'Water / sewer',amount:null,day:null,category:'Utilities',payer:'Shared',confirmed:false,paid:{}},{id:5,name:'Renters insurance',amount:null,day:null,category:'Insurance',payer:'Shared',confirmed:false,paid:{}}],events:[{time:new Date().toISOString(),message:'Welcome home! Your HomeBase demo is ready.',detail:'Your information is saved on this device only.'}]});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(state.bills))throw Error('Invalid data');}catch{state=initial()}let tab='home';let modal=null;const $=id=>document.getElementById(id);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));const amount=b=>Number(b.amount||0);const paid=b=>!!b.paid?.[state.month];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Local storage is unavailable. Export a backup instead.')}};const sum=()=>state.bills.reduce((s,b)=>s+amount(b),0);const paidTotal=()=>state.bills.filter(paid).reduce((s,b)=>s+amount(b),0);const dateTitle=()=>new Date(`${state.month}-01T12:00:00`).toLocaleDateString('en-US',{month:'short',year:'numeric'});const monthShift=n=>{const [y,m]=state.month.split('-').map(Number);const d=new Date(y,m-1+n,1);state.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;save();render()};const log=(message,detail='')=>{state.events.unshift({time:new Date().toISOString(),message,detail});state.events=state.events.slice(0,100)};const toast=msg=>{const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3400)};
const monthNav=()=>`<div class="months"><button data-act="prev" aria-label="Previous month">‹</button><span>${dateTitle()}</span><button data-act="next" aria-label="Next month">›</button></div>`;
const status=b=>paid(b)?'<span class="status paid">✓ Paid</span>':b.confirmed?'<span class="status">Unpaid</span>':'<span class="status review">Needs details</span>';
const short=b=>`<div class="billrow"><div class="datebox"><span>${b.day?'DUE':'DATE'}</span><strong>${b.day??'—'}</strong></div><div class="billinfo"><b>${escapeHtml(b.name)}</b><small>${escapeHtml(b.category)} · ${escapeHtml(b.payer)}${b.confirmed?'':' · estimate'}</small></div><div class="billend"><strong>${b.amount===null?'TBD':fmt(b.amount)}</strong>${status(b)}<div class="actions-inline">${paid(b)?`<button class="smallbtn" data-act="unpay" data-id="${b.id}">Undo</button>`:`<button class="smallbtn" data-act="pay" data-id="${b.id}">Mark paid</button>`}</div></div></div>`;
const cats=()=>Object.entries(state.bills.reduce((acc,b)=>{acc[b.category]=(acc[b.category]||0)+amount(b);return acc},{})).sort((a,b)=>b[1]-a[1]);
function renderHome(){const total=sum(),done=paidTotal(),split=state.share;const j=state.bills.reduce((s,b)=>s+amount(b)*(b.payer==='Alex'?1:b.payer==='Sam'?0:split/100),0),a=total-j;const budget=Number(state.budget)||0;return `<section class="overview"><div class="hero"><div class="heroheader"><span class="label">MONTHLY HOUSEHOLD BILLS</span>${monthNav()}</div><h2>${fmt(total)}</h2><p>${fmt(total-done)} left to pay · amounts may be incomplete</p><div class="progress"><div style="width:${total?Math.min(100,done/total*100):0}%"></div></div><div class="progresslabel"><span>${state.bills.filter(paid).length} of ${state.bills.length} bills marked paid</span><span>${total?Math.round(done/total*100):0}% complete</span></div></div><div class="breakdown"><div class="sectionlabel">Household split</div><div class="note">${split}% Alex / ${100-split}% Sam for shared bills</div><div class="splitrow"><div class="person"><span>J</span>Alex</div><strong>${fmt(j)}</strong></div><div class="splitrow"><div class="person a"><span>A</span>Sam</div><strong>${fmt(a)}</strong></div><div class="divider"></div><div class="budgetline"><b>Budget used</b><b>${budget?Math.round(total/budget*100):0}%</b></div><div class="meter"><div style="width:${budget?Math.min(100,total/budget*100):0}%;background:${total>budget?'#c77b76':'#6da994'}"></div></div><div class="tiny">${total>budget?fmt(total-budget)+' over budget':fmt(Math.max(0,budget-total))+' remaining from '+fmt(budget)+' budget'}</div></div></section><section class="metrics"><div class="metric"><span>✓ Marked paid</span><strong>${fmt(done)}</strong><small>For ${dateTitle()}</small></div><div class="metric"><span>◷ Still to pay</span><strong>${fmt(total-done)}</strong><small>Known bill amounts only</small></div><div class="metric"><span>ⓘ Need confirmation</span><strong>${state.bills.filter(b=>!b.confirmed).length}</strong><small>Check amounts and due dates</small></div></section><section class="columns"><div class="panel"><div class="panelhead"><div><h3>Upcoming & unpaid</h3><p>Your monthly household checklist</p></div><button class="link" data-tab="bills">All bills →</button></div>${state.bills.filter(b=>!paid(b)).sort((a,b)=>(a.day??99)-(b.day??99)).slice(0,6).map(short).join('')||'<div class="empty">All tracked bills have been marked paid! ✨</div>'}<button class="add" data-act="add">+ Add another bill</button></div><div class="panel"><div class="panelhead"><div><h3>Where your money goes</h3><p>Based on known monthly amounts</p></div></div>${cats().map(([k,v])=>`<div class="category"><div class="cathead"><span>${escapeHtml(k)}</span><b>${fmt(v)}</b></div><div class="catmeter"><div style="width:${total?(v/total)*100:0}%"></div></div></div>`).join('')}<div class="notice">🔒 Privacy first. This demo never requests bank credentials. Automatic payment detection is only available after configuring the separate live backend.</div></div></section>`}
function renderBills(){return `<section class="panel"><div class="topcontrols"><h2>Monthly bills</h2><div class="toolbar">${monthNav()}<button class="btn" data-act="add">+ Add bill</button></div></div><div class="cardlist">${[...state.bills].sort((a,b)=>(a.day??99)-(b.day??99)).map(b=>`<div class="fullbill"><div class="details"><div class="billglyph">${({Housing:'⌂',Internet:'⌁',Utilities:'⚡',Insurance:'♢',Transportation:'🚙',Groceries:'🥬',Subscriptions:'▣'})[b.category]||'▤'}</div><div><b>${escapeHtml(b.name)}</b><small>${b.day?'Due day '+b.day:'Due date not set'} · ${escapeHtml(b.payer)}${b.confirmed?'':' · estimate'}</small></div></div><div class="fullbillright"><strong>${b.amount===null?'TBD':fmt(b.amount)}</strong>${status(b)}<div class="action"><button data-act="edit" data-id="${b.id}">Edit</button><button data-act="${paid(b)?'unpay':'pay'}" data-id="${b.id}">${paid(b)?'Undo':'✓ Paid'}</button></div></div></div>`).join('')}</div></section><p class="notice">Payment status here is recorded manually. We won't label a payment as bank-verified in this offline version.</p>`}
function renderActivity(){return `<section class="panel"><div class="panelhead"><div><h3>Household activity</h3><p>Actions recorded in this demo on this device</p></div></div><div class="activity">${state.events.length?state.events.map(e=>`<div class="activityitem"><div class="dot">✓</div><div><strong>${escapeHtml(e.message)}</strong><p>${escapeHtml(e.detail||'Household update')}</p><small>${new Date(e.time).toLocaleString()}</small></div></div>`).join(''):'<div class="empty">No activity yet.</div>'}</div></section><div class="notice">🔔 Real push reminders require the live HTTPS app, push permission, and scheduled jobs. This offline demo does not send notifications.</div>`}
function renderSettings(){return `<section class="panel"><div class="panelhead"><div><h3>Household preferences</h3><p>Customize this local demo</p></div></div><div class="optionrow"><div><strong>Monthly bills budget</strong><small>Set a target to compare estimated expenses</small></div><input aria-label="Monthly budget" id="budget" type="number" min="0" step="1" value="${state.budget}"></div><div class="optionrow"><div><strong>Alex's portion of shared bills</strong><small>Sam pays the remaining percentage</small></div><select id="share"><option value="50" ${state.share===50?'selected':''}>50%</option><option value="60" ${state.share===60?'selected':''}>60%</option><option value="70" ${state.share===70?'selected':''}>70%</option><option value="40" ${state.share===40?'selected':''}>40%</option><option value="30" ${state.share===30?'selected':''}>30%</option></select></div><div class="optionrow"><div><strong>Save your progress</strong><small>Download a JSON backup, or restore a previous one.</small></div><div class="toolbar"><button class="btn secondary" data-act="export">Export</button><button class="btn secondary" data-act="import">Import</button></div></div><div class="optionrow"><div><strong>Reset the demo</strong><small>Erases local bills and restores starting values on this device.</small></div><button class="btn red" data-act="reset">Reset</button></div><div class="divider"></div><h3>How privacy works</h3><div class="privacy-panel">Your entries are stored in this browser's local storage. No bank account, remote database, or analytics service is connected to this demo. Anyone with access to this browser profile may be able to view the entries. Clearing site data or switching devices can erase them; keep an exported backup. To share in real time, you'll need to configure the production Supabase backend.</div></section>`}
function render(){const titles={home:['Good to be home.','Everything you need to stay ahead of household bills.'],bills:['Your bills, organized.','Review dates, update estimates and record payments.'],activity:['Your household activity.','Keep track of what you have taken care of.'],settings:['Make it yours.','Fine-tune the household budget and privacy controls.']};$('headerTitle').textContent=titles[tab][0];$('headerSub').textContent=titles[tab][1];$('sideNav').innerHTML=tabs.map(([k,ic,l])=>`<button data-tab="${k}" class="${tab===k?'active':''}"><span style="font-size:23px;width:19px;text-align:center">${ic}</span>${l}</button>`).join('');$('mobileNav').innerHTML=tabs.map(([k,ic,l])=>`<button data-tab="${k}" class="${tab===k?'active':''}"><span style="font-size:23px">${ic}</span>${l}</button>`).join('');$('view').innerHTML=tab==='home'?renderHome():tab==='bills'?renderBills():tab==='activity'?renderActivity():renderSettings();}
function showEditor(id){const b=id===null?null:state.bills.find(x=>x.id===id);modal=id===null?'new':id;const opts=(arr,val)=>arr.map(x=>`<option value="${escapeHtml(x)}" ${x===val?'selected':''}>${escapeHtml(x)}</option>`).join('');$('modalRoot').innerHTML=`<div class="dialogshade" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h3 id="dialogTitle">${b?'Edit bill':'Add a household bill'}</h3><p>Only mark confirmed when you've checked the correct amount and due date.</p><form id="billForm"><div class="fields"><div class="field whole"><label for="fName">Bill name</label><input id="fName" required maxlength="80" placeholder="e.g. Car insurance" value="${escapeHtml(b?.name||'')}"></div><div class="field"><label for="fAmount">Monthly amount ($)</label><input id="fAmount" type="number" min="0" step="0.01" placeholder="Unknown" value="${b?.amount??''}"></div><div class="field"><label for="fDay">Due day (1–31)</label><input id="fDay" type="number" min="1" max="31" step="1" placeholder="Unknown" value="${b?.day??''}"></div><div class="field"><label for="fCategory">Category</label><select id="fCategory">${opts(['Housing','Utilities','Internet','Insurance','Groceries','Transportation','Subscriptions','Other'],b?.category||'Other')}</select></div><div class="field"><label for="fPayer">Paid by</label><select id="fPayer">${opts(['Shared','Alex','Sam'],b?.payer||'Shared')}</select></div><div class="field whole"><label style="display:flex;align-items:center;gap:9px"><input id="fConfirmed" type="checkbox" style="width:auto" ${b?.confirmed?'checked':''}> This amount is confirmed</label></div></div><div class="dialogfooter">${b?'<button type="button" class="btn red" data-act="delete">Delete</button>':''}<button type="button" class="btn outline" data-act="close">Cancel</button><button class="btn" type="submit">Save bill</button></div></form></div></div>`;$('billForm').addEventListener('submit',e=>{e.preventDefault();const name=$('fName').value.trim(),av=$('fAmount').value.trim(),dv=$('fDay').value.trim(),a=av===''?null:Number(av),d=dv===''?null:Number(dv);if(!name||name.length>80||a!==null&&(!Number.isFinite(a)||a<0)||d!==null&&(!Number.isInteger(d)||d<1||d>31)){toast('Please enter a valid bill name, amount and due day.');return}const row={name,amount:a,day:d,category:$('fCategory').value,payer:$('fPayer').value,confirmed:$('fConfirmed').checked};if(b){Object.assign(b,row);log(`${name} updated`,'Bill details changed')}else{state.bills.push({id:state.nextId++,paid:{},...row});log(`${name} added`,'New monthly bill')};save();close();render();toast('Bill saved')});}
function close(){modal=null;$('modalRoot').innerHTML=''}
function exportFile(){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='homebase-backup-'+state.month+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function applyImport(obj){const s=obj?.data;if(obj?.version!==2||!s||!Array.isArray(s.bills)||typeof s.month!=='string'||!Array.isArray(s.events)||s.bills.length>3000||s.events.length>10000)throw Error('This is not a valid HomeBase backup');const cleaned={...initial(),month:/^\d{4}-(0[1-9]|1[0-2])$/.test(s.month)?s.month:'2026-11',budget:Math.max(0,Number(s.budget)||0),share:Math.min(100,Math.max(0,Number(s.share)||50)),bills:s.bills.filter(b=>Number.isInteger(b.id)&&b.id>=0&&typeof b.name==='string'&&b.name.length<=80).map(b=>({id:b.id,name:b.name,amount:b.amount===null?null:Math.max(0,Number(b.amount)||0),day:b.day===null?null:Math.max(1,Math.min(31,Number(b.day)||1)),category:String(b.category||'Other').slice(0,32),payer:['Alex','Sam','Shared'].includes(b.payer)?b.payer:'Shared',confirmed:!!b.confirmed,paid:typeof b.paid==='object'&&b.paid!==null?Object.fromEntries(Object.entries(b.paid).filter(([k,v])=>/^\d{4}-\d{2}$/.test(k)&&v===true)):{} })),events:s.events.slice(0,100).filter(e=>typeof e.message==='string'&&typeof e.time==='string').map(e=>({time:e.time,message:e.message.slice(0,200),detail:String(e.detail||'').slice(0,300)}))};cleaned.nextId=Math.max(0,...cleaned.bills.map(b=>b.id))+1;state=cleaned;save();render()}
document.addEventListener('click',e=>{const target=e.target.closest('[data-tab],[data-act]');if(!target)return;const destination=target.dataset.tab;if(destination){tab=destination;render();window.scrollTo(0,0);return}const act=target.dataset.act;const id=Number(target.dataset.id);const b=state.bills.find(x=>x.id===id);if(act==='prev'||act==='next'){monthShift(act==='prev'?-1:1);return}if(act==='add'){showEditor(null);return}if(act==='edit'&&b){showEditor(id);return}if(act==='close'){close();return}if(act==='pay'||act==='unpay'){if(!b)return;b.paid=b.paid||{};b.paid[state.month]=act==='pay';log(`${b.name} marked ${act==='pay'?'paid':'unpaid'}`,dateTitle()+' · Manual update');save();render();toast(act==='pay'?'Payment recorded manually':'Payment status reset');return}if(act==='delete'){const b=state.bills.find(x=>x.id===modal);if(b&&confirm(`Delete ${b.name}?`)){state.bills=state.bills.filter(x=>x.id!==modal);log(`${b.name} deleted`);save();close();render();toast('Bill deleted')}return}if(act==='reset'){if(confirm('Erase local HomeBase data and restore the sample bills?')){state=initial();save();tab='home';render();toast('Demo reset')}return}if(act==='export'){exportFile();toast('Backup downloaded');return}if(act==='import'){$('fileImport').click();return}});
document.addEventListener('change',e=>{if(e.target.id==='budget'){state.budget=Math.max(0,Number(e.target.value)||0);save();toast('Budget updated')}if(e.target.id==='share'){state.share=Number(e.target.value);save();toast('Shared bill split updated')}});$('fileImport').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2000000)throw Error('Backup too large');const data=JSON.parse(await file.text());if(!confirm('Replace this device’s HomeBase data with the imported backup?'))return;applyImport(data);toast('Backup restored')}catch(err){toast(err.message||'Could not import file')}finally{e.target.value=''}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal!==null)close()});render();
})();
</script></body></html>
